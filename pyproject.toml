[tool.poetry]
name = "ai-music-tagger"
version = "0.1.0"
description = "An open-source AI music metadata tagging pipeline"
authors = ["AI Music Tagger Contributors"]
readme = "README.md"
packages = [{include = "music_tagger"}]

[tool.poetry.dependencies]
python = "^3.8"
transformers = "^4.35.0"
torch = "^2.0.0"
accelerate = "^1.10.0"
librosa = "^0.10.0"
soundfile = "^0.12.0"
openai = "^1.0.0"
python-dotenv = "^1.0.0"
click = "^8.1.0"
pydantic = "^2.0.0"
numpy = "^1.24.0"
tqdm = "^4.65.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.12.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[tool.poetry.scripts]
music-tagger = "music_tagger.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
